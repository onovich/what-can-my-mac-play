<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">What Can My Mac Play?</title>
  <desc id="desc">Repository cover showing device profile, game library, and dated reports converging into separate compatibility and confidence results.</desc>

  <rect width="1280" height="640" fill="#F3EFE5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="72" y="74" width="228" height="38" rx="19" fill="#DDE8DE"/>
    <circle cx="94" cy="93" r="5" fill="#2B6C55"/>
    <text x="110" y="99" font-size="16" font-weight="700" letter-spacing="1.6" fill="#244B3F">PRODUCT RESEARCH</text>

    <text x="72" y="228" font-size="76" font-weight="760" letter-spacing="-3" fill="#18222B">What Can My</text>
    <text x="72" y="326" font-size="94" font-weight="790" letter-spacing="-4" fill="#18222B">Mac Play<tspan fill="#E65F45">?</tspan></text>

    <text x="76" y="414" font-size="30" font-weight="560" fill="#34434D">Find games likely to work</text>
    <text x="76" y="452" font-size="30" font-weight="560" fill="#34434D">on your Mac.</text>

    <text x="76" y="532" font-size="18" font-weight="650" letter-spacing="1.2" fill="#6D766F">DEVICE-AWARE</text>
    <circle cx="240" cy="526" r="3" fill="#E65F45"/>
    <text x="258" y="532" font-size="18" font-weight="650" letter-spacing="1.2" fill="#6D766F">TRACEABLE</text>
    <circle cx="388" cy="526" r="3" fill="#E65F45"/>
    <text x="406" y="532" font-size="18" font-weight="650" letter-spacing="1.2" fill="#6D766F">CURRENT</text>

    <rect x="626" y="72" width="582" height="496" rx="34" fill="#162631"/>
    <text x="670" y="122" font-size="17" font-weight="700" letter-spacing="2" fill="#9EB2B8">EVIDENCE PATH</text>

    <g>
      <rect x="670" y="151" width="188" height="72" rx="16" fill="#223A46" stroke="#55717A"/>
      <circle cx="698" cy="187" r="11" fill="#7FC6A4"/>
      <text x="721" y="182" font-size="14" font-weight="700" letter-spacing="1.2" fill="#9EB2B8">DEVICE</text>
      <text x="721" y="202" font-size="18" font-weight="650" fill="#F3EFE5">Mac profile</text>

      <rect x="670" y="266" width="188" height="72" rx="16" fill="#223A46" stroke="#55717A"/>
      <rect x="688" y="291" width="20" height="20" rx="5" fill="#F0B45A"/>
      <text x="721" y="297" font-size="14" font-weight="700" letter-spacing="1.2" fill="#9EB2B8">LIBRARY</text>
      <text x="721" y="317" font-size="18" font-weight="650" fill="#F3EFE5">Game IDs</text>

      <rect x="670" y="381" width="188" height="72" rx="16" fill="#223A46" stroke="#55717A"/>
      <path d="M688 407h20M688 415h15M688 423h18" stroke="#E98169" stroke-width="3" stroke-linecap="round"/>
      <text x="721" y="412" font-size="14" font-weight="700" letter-spacing="1.2" fill="#9EB2B8">REPORTS</text>
      <text x="721" y="432" font-size="18" font-weight="650" fill="#F3EFE5">Source + date</text>
    </g>

    <g fill="none" stroke="#6F8A92" stroke-width="3" stroke-linecap="round">
      <path d="M858 187H880Q898 187 898 205V278"/>
      <path d="M858 302H878"/>
      <path d="M858 417H880Q898 417 898 399V326"/>
    </g>

    <circle cx="914" cy="302" r="44" fill="#E65F45"/>
    <text x="914" y="297" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#FFF7ED">MATCH</text>
    <text x="914" y="316" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#FFF7ED">&amp; SCORE</text>

    <path d="M958 302H984" fill="none" stroke="#6F8A92" stroke-width="3" stroke-linecap="round"/>

    <rect x="984" y="215" width="180" height="174" rx="20" fill="#F3EFE5"/>
    <text x="1008" y="249" font-size="13" font-weight="800" letter-spacing="1.5" fill="#6D766F">DECISION</text>
    <text x="1008" y="285" font-size="17" font-weight="700" fill="#18222B">Compatibility</text>
    <rect x="1008" y="298" width="128" height="8" rx="4" fill="#D8D2C5"/>
    <rect x="1008" y="298" width="88" height="8" rx="4" fill="#2B6C55"/>
    <text x="1008" y="340" font-size="17" font-weight="700" fill="#18222B">Confidence</text>
    <rect x="1008" y="353" width="128" height="8" rx="4" fill="#D8D2C5"/>
    <rect x="1008" y="353" width="61" height="8" rx="4" fill="#F0B45A"/>

    <text x="670" y="520" font-size="17" font-weight="560" fill="#9EB2B8">Compatibility is not certainty.</text>
  </g>
</svg>
